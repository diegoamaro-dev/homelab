name: amarolab-aurora-voice

services:

  # Home Assistant Wyoming path (loopback-published; HA runs on host network).
  aurora-whisper:
    image: rhasspy/wyoming-whisper:3.2.0
    container_name: aurora-whisper
    restart: unless-stopped
    ports:
      - "127.0.0.1:10300:10300"
    command:
      - --model
      - base-int8
      - --language
      - auto
      - --beam-size
      - "1"
      - --compute-type
      - int8
    volumes:
      - /srv/homelab/data/whisper/wyoming:/data
    cpus: 4.0
    mem_limit: 4g
    networks:
      - ai-local_default

  aurora-piper:
    image: rhasspy/wyoming-piper:2.2.2
    container_name: aurora-piper
    restart: unless-stopped
    ports:
      - "127.0.0.1:10200:10200"
    command:
      - --voice
      - es_ES-sharvard-medium
      - --speaker
      - "F"
      - --length-scale
      - "1.0"
    volumes:
      - /srv/homelab/data/piper:/data
    cpus: 1.0
    mem_limit: 1g
    networks:
      - ai-local_default

  aurora-wakeword:
    image: rhasspy/wyoming-openwakeword:2.1.0
    container_name: aurora-wakeword
    restart: unless-stopped
    ports:
      - "127.0.0.1:10400:10400"
    command:
      - --custom-model-dir
      - /custom_models
      - --threshold
      - "0.5"
      - --trigger-level
      - "1"
    volumes:
      - /srv/homelab/data/wakeword:/custom_models
    cpus: 1.0
    mem_limit: 512m
    networks:
      - ai-local_default

  # Open WebUI audio path (OpenAI-API HTTP shims). No published ports —
  # reached over the docker network only.
  aurora-whisper-http:
    image: fedirz/faster-whisper-server:0.6.0-rc.3-cpu
    container_name: aurora-whisper-http
    restart: unless-stopped
    environment:
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__MODEL: Systran/faster-whisper-base
    volumes:
      - /srv/homelab/data/whisper/http:/home/ubuntu/.cache/huggingface
    networks:
      - ai-local_default

  aurora-piper-http:
    image: ghcr.io/matatonic/openedai-speech:0.18.2
    container_name: aurora-piper-http
    restart: unless-stopped
    entrypoint:
      - /bin/bash
    command:
      - -c
      - python speech.py --xtts_device none --host 0.0.0.0 --port 8000
    volumes:
      - /srv/homelab/data/openedai-speech/voice_to_speaker.yaml:/app/config/voice_to_speaker.yaml:ro
      - /srv/homelab/data/piper:/app/voices:ro
    networks:
      - ai-local_default

networks:
  ai-local_default:
    external: true
    name: ai-local_default
