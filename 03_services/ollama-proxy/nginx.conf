# ollama-proxy — RTX-1.6 failover front end for the AURORA ollama endpoint.
#
# Presents ONE stable internal endpoint and routes:
#   primary  -> Torre  (RTX 5070 GPU node, over Tailscale)
#   fallback -> UM790  (local CPU ollama container) when Torre is unreachable,
#               or (F-INC-2) reachable but answering 404 for the requested model
#
# Model catalogue (GET /api/tags) is served by the UM790 — the always-on floor —
# so every listed model is servable even when Torre is up but has no models
# (F-INC-2, after the 2026-10-20 incident). Torre is only the catalogue backup.
#
# Consumers (Open WebUI, Home Assistant) point at this proxy, never at Torre
# directly, so a sleeping/offline Torre transparently fails over to the UM790.
# Not covered: a Torre that answers 500 (no http_500 fallback, by decision).
# Rollback = repoint consumers back to the UM790 ollama and remove this proxy.

worker_processes 1;
events { worker_connections 1024; }

http {
    # Observability: record which upstream actually served each request, and
    # what each attempted upstream answered: "404, 200" = model-missing
    # fallback; "502, 200" / "504, 200" = transport fallback (nginx records
    # 502 for a connection error and 504 for a timeout).
    log_format ollama '$remote_addr [$time_local] "$request" '
                      'status=$status upstream=$upstream_addr '
                      'ustatus=$upstream_status '
                      'ut=$upstream_response_time';
    access_log /dev/stdout ollama;
    error_log  /dev/stderr warn;

    upstream ollama_pool {
        # Torre (GPU) — primary. Marked down after 1 failure for 10s, then retried.
        server 100.91.154.124:11434 max_fails=1 fail_timeout=10s;
        # UM790 (CPU) — always-on fallback. Only used when Torre is down.
        server ollama:11434 backup;
    }

    # F-INC-2: model catalogue. The UM790 is authoritative (always-on floor);
    # Torre answers the catalogue only if the UM790 ollama is unavailable.
    upstream ollama_catalogue {
        server ollama:11434 max_fails=1 fail_timeout=10s;
        server 100.91.154.124:11434 backup;
    }

    server {
        listen 11434;

        # Large prompts / embeddings / image payloads.
        client_max_body_size 50m;

        # Local health probe (does not touch upstreams).
        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ollama-proxy ok\n";
        }

        # F-INC-2: the model list comes from the always-on catalogue, so a
        # reachable-but-empty Torre can no longer hide Aurora's base model.
        location = /api/tags {
            proxy_pass http://ollama_catalogue;

            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;

            # GET is idempotent: transport errors move to the catalogue backup.
            proxy_next_upstream         error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries   2;
            proxy_next_upstream_timeout 15s;
        }

        location / {
            proxy_pass http://ollama_pool;

            # Streaming token output must not be buffered.
            proxy_http_version 1.1;
            proxy_buffering    off;
            proxy_set_header   Connection "";

            # Fast failover detection; long generation budget for CPU fallback.
            proxy_connect_timeout 5s;
            proxy_read_timeout    900s;
            proxy_send_timeout    900s;

            # Fail the request over to the backup on connection-level errors,
            # and (F-INC-2) on 404 — Ollama's "model not found" — so a Torre
            # that is reachable but lacks the model is functionally unavailable
            # for that model. nginx never counts a 404 as a server failure, so
            # Torre is NOT marked down and the next request tries Torre again.
            # non_idempotent allows POST (/api/generate, /api/chat) to retry.
            proxy_next_upstream         error timeout http_404 http_502 http_503 http_504 non_idempotent;
            proxy_next_upstream_tries   2;
            proxy_next_upstream_timeout 15s;
        }
    }
}
