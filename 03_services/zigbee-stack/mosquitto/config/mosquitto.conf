# /mosquitto/config/mosquitto.conf
# Phase 0 / R-04 — restored 2026-06-13 to stop the restart loop.
# Hardened 2026-06-17 — authenticated + ACL-scoped access only.
# Anonymous access disabled; per-user ACLs enforced.
# See 03_services/zigbee-stack/mosquitto/auth-hardening.md.

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acls
