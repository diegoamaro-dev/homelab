# /mosquitto/config/mosquitto.conf
# Phase 0 / R-04 — restored 2026-06-13 to stop the restart loop.
# Anonymous listener only — matches the documented "fase de validación
# local" posture. Switch off anonymous and add password_file once a
# zigbee2mqtt MQTT user is provisioned (see follow-up notes).

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

listener 1883 0.0.0.0
allow_anonymous true
