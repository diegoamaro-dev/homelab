# AMAROLAB Knowledge Platform — Retrieval Validation Fixture
# =========================================================================
# Status:   PERMANENT, STABLE. Project documentation (Phase E, step E-5).
# Purpose:  The canonical, fixed query corpus used by every Phase E E-5
#           retrieval validation run — E5-a (version-skew drift measurement),
#           E5-b (Qdrant restore drill), E5-c (controlled audit-log check),
#           and any future retrieval-regression check.
#
# Why it exists:
#   Retrieval validation is only comparable run-to-run if the queries never
#   change. An ad-hoc query set makes "no drift" unfalsifiable. This fixture
#   freezes the corpus so any future run measures the SAME thing.
#
# STABILITY CONTRACT (binding):
#   - Query `id`s and their `query` text are FIXED. Never edit or delete an
#     existing entry — doing so silently invalidates run-to-run comparison.
#   - You MAY append a new entry (new id) with a documented reason, but the
#     existing 16 must stay byte-stable.
#   - `myfreetour` is intentionally absent: it is an empty/disabled
#     placeholder (0 points). When it is populated by a future project it
#     gets its own appended entries — it is NOT part of the v1 fixture.
#
# Selection criteria (how these 16 were chosen):
#   - Cover every POPULATED collection (homelab_docs, guardian_cloud,
#     ensambla2, infra_audits) — 4 queries each.
#   - Both languages where appropriate: 8 Spanish + 8 English (AURORA is used
#     primarily in es-ES against largely English technical docs).
#   - Representative of real AURORA usage; intentionally small.
#   - Phrased to return non-empty results (each collection has 100s of points)
#     so the retrieval comparison exercises real ranking.
#
# Schema (per entry):
#   id:         stable unique identifier (COLLECTIONPREFIX-NN)
#   collection: target Qdrant collection (must be one of the 4 populated)
#   lang:       es | en
#   query:      the natural-language query string (2..500 chars; E5 prefixes
#               are added by ingest/embedder.py at embed time, NOT here)
# =========================================================================

version: 1
created: 2026-06-27
